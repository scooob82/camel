name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl
      - run: npm install
      - name: Unit tests (core, catalog generator)
        run: npm test
      - name: Type check
        run: npm run typecheck
        continue-on-error: true # not yet verified against @types/react — make blocking once green
      - name: ESLint
        run: npm run lint
        continue-on-error: true # first run — make blocking once the baseline is clean
      - name: PHP lint
        run: find api scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: API tests
        run: npm run test:api
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7
