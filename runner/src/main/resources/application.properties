server.port=${PORT:8090}
spring.application.name=studio-runner
# Shared secret with the PHP API (config: runner.token). Required.
runner.token=${RUNNER_TOKEN:}
runner.max-timeout-ms=15000
runner.max-body-bytes=1000000
runner.max-trace-events=500
runner.max-concurrent-runs=4
spring.servlet.multipart.enabled=false
server.tomcat.max-swallow-size=2MB
spring.mvc.converters.preferred-json-mapper=jackson
